<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#2B3A55">
<title>旅の記録 since 2026</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='9' fill='%23C9482F'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='white' font-family='serif'%3E旅%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Shippori+Mincho:wght@500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Shippori+Mincho:wght@500;700&display=swap"></noscript>
<style>
  :root {
    --washi:#F4F7FA; --paper:#FFFFFF; --sumi:#26303D; --sumi-2:#5F6B7A;
    --ai:#3F5878; --ai-2:#9DB2CB; --shu:#E8873A; --hanko:#C9482F; --matsu:#4E6B4F;
    --edge:rgba(63,88,120,.14);
    --mincho:"Shippori Mincho","Noto Serif TC","Hiragino Mincho ProN","Yu Mincho","PMingLiU",serif;
    --serif:"Noto Serif TC","Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","PMingLiU",serif;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--washi); color:var(--sumi); font-family:var(--serif); font-size:17px; line-height:1.7; }
  h1,h2,h3,p { margin:0; }
  a { color:inherit; }
  :focus-visible { outline:3px solid var(--hanko); outline-offset:3px; }

  /* 上方：直書標題＋印鑑（與各旅行頁首頁同一套語彙） */
  .top { background:linear-gradient(180deg,#C9D4E3 0%,#E3E9EF 62%,var(--washi) 100%); padding:calc(44px + env(safe-area-inset-top,0px)) 24px 34px; }
  .top-in { max-width:960px; margin:0 auto; display:flex; align-items:flex-start; gap:16px; }
  .vtitle { order:2; writing-mode:vertical-rl; font-family:var(--mincho); font-weight:700; font-size:clamp(52px,11vw,88px); letter-spacing:.14em; line-height:1.05; }
  .vsub { order:1; writing-mode:vertical-rl; font-family:var(--mincho); font-weight:500; font-size:clamp(15px,3.2vw,20px); letter-spacing:.4em; margin-top:6px; padding-left:12px; border-left:2px solid var(--hanko); color:var(--sumi-2); }
  .hanko { order:3; flex:none; margin:6px 0 0 4px; width:52px; height:52px; display:grid; place-content:center; background:var(--hanko); color:#fff; font-family:var(--mincho); font-weight:700; font-size:1.7rem; line-height:1; border-radius:9px; transform:rotate(-5deg); box-shadow:inset 0 0 0 2px var(--hanko),inset 0 0 0 3.5px #fff; opacity:.94; }

  main { max-width:960px; margin:0 auto; padding:8px 20px 72px; }
  .yr { display:flex; align-items:baseline; gap:14px; margin:34px 0 16px; padding-bottom:8px; font-family:var(--mincho); font-weight:700; font-size:1.5rem; color:var(--ai); border-bottom:1px solid var(--edge); position:relative; }
  .yr::after { content:""; position:absolute; left:0; bottom:-2px; width:56px; height:3px; border-radius:3px; background:var(--shu); }
  .yr small { font-family:var(--serif); font-weight:400; font-size:.82rem; color:var(--sumi-2); }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:18px; }
  .trip { display:flex; flex-direction:column; text-decoration:none; background:var(--paper); border:1px solid var(--edge); border-radius:18px; overflow:hidden; box-shadow:0 10px 28px rgba(63,88,120,.10); transition:transform .18s, box-shadow .18s; }
  @media (hover:hover) { .trip:hover { transform:translateY(-3px); box-shadow:0 14px 32px rgba(63,88,120,.18); } }
  .ph { position:relative; aspect-ratio:4/3; background:linear-gradient(135deg,#C9D4E3,#E3E9EF); }
  .ph img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:30% 80%; display:block; }
  .st { position:absolute; left:12px; top:12px; padding:2px 12px; border-radius:999px; font-size:.78rem; letter-spacing:.06em; color:#fff; background:var(--shu); box-shadow:0 2px 8px rgba(31,27,22,.25); }
  .st.now { background:var(--matsu); }
  .st.done { background:rgba(38,48,61,.72); }
  .bd { padding:14px 18px 18px; }
  .dt { font-size:.82rem; color:var(--sumi-2); letter-spacing:.06em; }
  .bd h3 { font-family:var(--mincho); font-weight:700; font-size:1.55rem; line-height:1.35; color:var(--ai); }
  .bd h3 small { margin-left:.6em; font-family:var(--serif); font-weight:400; font-size:.85rem; letter-spacing:.2em; color:var(--sumi-2); }
  .rg { margin-top:2px; font-size:.86rem; color:var(--sumi-2); }

  .empty { padding:24px; text-align:center; color:var(--sumi-2); }
  footer { padding:8px 16px calc(28px + env(safe-area-inset-bottom,0px)); text-align:center; font-family:var(--mincho); letter-spacing:.3em; color:var(--ai-2); font-size:.9rem; }
  @media (max-width:640px) { body { font-size:16px; } .top { padding-left:18px; padding-right:18px; } }
  @media (prefers-reduced-motion:reduce) { .trip { transition:none; } }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <h1 class="vtitle">旅の記録</h1>
    <p class="vsub">since 2026</p>
    <div class="hanko" aria-hidden="true">旅</div>
  </div>
</header>

<main id="list"><noscript><p class="empty"><a href="2026-12-sendai/">仙台 冬の旅 2026</a></p></noscript></main>
<footer>良い旅を</footer>

<script>
/* ==========================================================
   旅行清單：新增一趟旅行，只要在下面加一行
   ----------------------------------------------------------
   start / end  出發、回程日期（YYYY-MM-DD，台灣時間）
   place        地點名稱        sub   副標題（可省略）
   region       地區（顯示在卡片上，例如「日本・東北」）
   path         旅行頁的資料夾（結尾要有 /）
   cover        封面圖（可省略；沒有或載入失敗就顯示色塊）
   順序不用管，程式會依日期排好、依年份分組
   ========================================================== */
const trips = [
  { start: "2026-12-08", end: "2026-12-12", place: "仙台", sub: "冬の旅", region: "日本・東北", path: "2026-12-sendai/", cover: "2026-12-sendai/cover.webp" }
];

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ZH = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
const day = s => Date.parse(s + "T00:00:00+08:00");
const todayStr = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Taipei" }).format(new Date());

function status(t) {
  const now = day(todayStr), a = day(t.start), b = day(t.end);
  if (now < a) { const n = Math.round((a - now) / 864e5); return { cls: "", text: n === 0 ? "今天出發" : `距離出發 ${n} 天` }; }
  if (now <= b) return { cls: "now", text: "旅行中" };
  return { cls: "done", text: "已完成" };
}
function range(t) {
  const [y1, m1, d1] = t.start.split("-"), [y2, m2, d2] = t.end.split("-");
  const n = Math.round((day(t.end) - day(t.start)) / 864e5) + 1;
  return `${y1}.${m1}.${d1} — ${y1 === y2 ? "" : y2 + "."}${m2}.${d2}　${ZH[n] || n}日間`;
}
function card(t) {
  const s = status(t);
  return `<a class="trip" href="${esc(t.path)}">
    <div class="ph">${t.cover ? `<img src="${esc(t.cover)}" alt="" loading="lazy" onerror="this.remove()">` : ""}<span class="st ${s.cls}">${s.text}</span></div>
    <div class="bd"><p class="dt">${range(t)}</p>
      <h3>${esc(t.place)}${t.sub ? `<small>${esc(t.sub)}</small>` : ""}</h3>
      ${t.region ? `<p class="rg">${esc(t.region)}</p>` : ""}</div></a>`;
}
const years = [...new Set(trips.map(t => t.start.slice(0, 4)))].sort().reverse();
document.getElementById("list").innerHTML = trips.length ? years.map(y => {
  const list = trips.filter(t => t.start.startsWith(y)).sort((a, b) => b.start.localeCompare(a.start));
  return `<section><h2 class="yr">${y}<small>${list.length} 趟旅行</small></h2><div class="grid">${list.map(card).join("")}</div></section>`;
}).join("") : '<p class="empty">還沒有旅行，在上面的清單加一行就會出現。</p>';
</script>
</body>
</html>
